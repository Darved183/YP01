{{define "content"}}
<div class="narrow">
  <form class="panel stack" method="post" action="/register">
    <h2>Новый клиент</h2>
    {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Имя<input name="name" required minlength="2" maxlength="80" autocomplete="name" value="{{.Text}}"></label>
    <label>Почта<input name="email" type="email" required autocomplete="email" value="{{.Email}}"></label>
    <label>Телефон<input name="phone" required maxlength="16" inputmode="numeric" placeholder="+7 900 000-00-00" autocomplete="tel" pattern="\+7 \d{3} \d{3}-\d{2}-\d{2}" title="+7 и 10 цифр" value="{{.Buyer}}" data-phone></label>
    <label>Пароль<input name="password" type="password" required minlength="4" autocomplete="new-password"></label>
    <label>Пароль ещё раз<input name="password2" type="password" required minlength="4" autocomplete="new-password"></label>
    <label class="check"><input type="checkbox" name="policy" required><span>Согласен с <a href="/policy">политикой конфиденциальности</a> и обработкой персональных данных</span></label>
    <button class="btn" type="submit">Создать аккаунт</button>
    <p class="muted small">Уже есть аккаунт? <a href="/login?next={{.Next}}">Войти</a></p>
  </form>
</div>
<script>
  // +7 стоит сразу. Буквы не проходят, остаются только 10 цифр номера.
  (function () {
    var input = document.querySelector("[data-phone]");
    if (!input) return;
    function digits(value) {
      var d = "";
      for (var i = 0; i < value.length; i++) {
        var c = value.charAt(i);
        if (c >= "0" && c <= "9") d += c;
      }
      if (d.charAt(0) === "7" || d.charAt(0) === "8") d = d.slice(1);
      return d.slice(0, 10);
    }
    function mask(d) {
      var out = "+7";
      if (!d) return out;
      out += " " + d.slice(0, 3);
      if (d.length > 3) out += " " + d.slice(3, 6);
      if (d.length > 6) out += "-" + d.slice(6, 8);
      if (d.length > 8) out += "-" + d.slice(8, 10);
      return out;
    }
    function paint() {
      var next = mask(digits(input.value));
      if (input.value !== next) input.value = next;
    }
    input.addEventListener("keydown", function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key.length !== 1) return;
      if (e.key < "0" || e.key > "9") e.preventDefault();
    });
    input.addEventListener("input", paint);
    input.addEventListener("focus", paint);
    paint();
  })();
</script>
{{end}}
